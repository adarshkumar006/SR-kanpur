<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mango Party</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        :root {
            --green: #486b43;
            --accent: #6ead65;
            --gold: #f2c14e;
            --cream: #fff8e8;
            --mint: #e8f7e8;
            --text: #55564f;
            --shadow: 0 16px 38px rgba(64, 82, 52, .12);
        }

        body {
            margin: 0;
            background:
                radial-gradient(circle at 8% 4%, #fff0c8 0, transparent 28rem),
                linear-gradient(180deg, var(--cream), #fffdf7 55%, var(--mint));
            color: var(--text);
            font-family: "DM Sans", Arial, sans-serif;
        }

        .page {
            width: min(1200px, calc(100% - 40px));
            margin: 0 auto;
            padding: clamp(28px, 5vw, 54px) 0;
        }

        .heading {
            text-align: center;
            margin-bottom: clamp(24px, 4vw, 40px);
        }

        .heading h1 {
            margin: 0;
            color: var(--green);
            font-family: "Playfair Display", Georgia, serif;
            font-size: clamp(36px, 6vw, 66px);
            font-weight: 700;
            line-height: 1.12;
            text-wrap: balance;
        }

        .heading p {
            margin: 10px 0 0;
            color: #777970;
            font-size: clamp(14px, 2vw, 17px);
        }

        .big-photo {
            width: 100%;
            height: clamp(280px, 52vw, 580px);
            overflow: hidden;
            border: 6px solid #fff;
            border-radius: 26px;
            background: var(--mint);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .big-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            transition: transform .6s ease;
        }

        .big-photo:hover img {
            transform: scale(1.025);
        }

        .photo {
            height: clamp(170px, 22vw, 260px);
            overflow: hidden;
            border: 5px solid #fff;
            border-radius: 20px;
            background: #fff;
            box-shadow: var(--shadow);
            transition: transform .25s ease, box-shadow .25s ease;
        }

        .photo:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 42px rgba(64, 82, 52, .17);
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .45s ease;
        }

        .photo:hover img {
            transform: scale(1.04);
        }

        @media (max-width: 767px) {
            .page {
                width: calc(100% - 28px);
            }
        }

        @media (max-width: 480px) {
            .big-photo {
                height: 300px;
                border-width: 4px;
                border-radius: 19px;
            }

            .photo {
                height: 165px;
                border-width: 3px;
                border-radius: 15px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- Heading -->
    <div class="heading">
        <h1>🥭 Mango Party</h1>
        <p>A Fun Day Full of Smiles & Sweet Memories</p>
    </div>


    <!-- BIG PHOTO -->
    <div class="big-photo">
        <img src="assets/mango-1.jpg" alt="Mango Party">
    </div>


    <!-- 5 OTHER PHOTOS -->
    <div class="row g-3">

        <div class="col-6">
            <div class="photo">
                <img src="assets/mango-2.jpg" alt="Mango Party">
            </div>
        </div>

        <div class="col-6">
            <div class="photo">
                <img src="assets/mango-3.jpg" alt="Mango Party">
            </div>
        </div>

        <div class="col-6">
            <div class="photo">
                <img src="assets/mango-4.jpg" alt="Mango Party">
            </div>
        </div>

        <div class="col-6">
            <div class="photo">
                <img src="assets/mango-5.jpg" alt="Mango Party">
            </div>
        </div>


    </div>

</div>

</body>
</html>
