<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grand Inauguration</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        :root {
            --green: #486b43;
            --accent: #6ead65;
            --gold: #f2c14e;
            --cream: #fff8e8;
            --mint: #e8f7e8;
            --text: #55564f;
            --shadow: 0 16px 38px rgba(64, 82, 52, .12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--cream);
            color: var(--text);
            font-family: "DM Sans", Arial, sans-serif;
        }

        .page {
            min-height: 100vh;
            padding: clamp(24px, 4vw, 44px) 20px;
            background:
                radial-gradient(circle at top left, rgba(242, 193, 78, .3), transparent 30%),
                radial-gradient(circle at bottom right, rgba(110, 173, 101, .2), transparent 34%),
                linear-gradient(145deg, var(--cream), #fff 54%, var(--mint));
        }

        .container-main {
            width: min(1250px, 100%);
            margin: auto;
        }

        .heading {
            margin-bottom: clamp(24px, 4vw, 38px);
            text-align: center;
        }

        .heading small {
            color: var(--accent);
            font-family: "DM Sans", Arial, sans-serif;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .2em;
        }

        .heading h1 {
            margin: 8px 0 0;
            color: var(--green);
            font-family: "Playfair Display", Georgia, serif;
            font-size: clamp(38px, 6vw, 72px);
            font-weight: 700;
            line-height: 1.1;
            text-transform: uppercase;
            text-wrap: balance;
        }

        .heading .line {
            width: 66px;
            height: 4px;
            margin: 16px auto 0;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--gold), var(--accent));
        }

        .guest-box {
            height: 100%;
            padding: 9px;
            border: 1px solid rgba(72, 107, 67, .16);
            border-radius: 20px;
            background: #fff;
            box-shadow: var(--shadow);
        }

        .guest-box img {
            display: block;
            width: 100%;
            height: clamp(240px, 31vw, 390px);
            border-radius: 13px;
            object-fit: cover;
            object-position: center;
        }

        .guest-name {
            padding: 11px 5px 3px;
            color: var(--green);
            font-family: "DM Sans", Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }

        .center-text {
            padding: 20px 10px;
            text-align: center;
        }

        .center-text h2 {
            margin-bottom: 8px;
            color: var(--green);
            font-family: "Playfair Display", Georgia, serif;
            font-size: clamp(25px, 3vw, 38px);
            line-height: 1.15;
        }

        .center-text p {
            margin: 0;
            color: var(--text);
            font-family: "DM Sans", Arial, sans-serif;
            font-size: 14px;
        }

        .gallery {
            margin-top: clamp(28px, 5vw, 48px);
        }

        .photo {
            height: clamp(170px, 22vw, 250px);
            overflow: hidden;
            border: 5px solid #fff;
            border-radius: 18px;
            background: #fff;
            box-shadow: var(--shadow);
            transition: transform .25s ease, box-shadow .25s ease;
        }

        .photo:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 42px rgba(64, 82, 52, .18);
        }

        .photo img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform .45s ease;
        }

        .photo:hover img {
            transform: scale(1.04);
        }

        @media (max-width: 991px) {
            .guest-box img {
                height: clamp(220px, 40vw, 330px);
            }

            .center-text {
                padding: 12px 5px;
            }
        }

        @media (max-width: 575px) {
            .page {
                padding: 22px 12px 32px;
            }

            .guest-box img {
                height: 280px;
            }

            .photo {
                height: 180px;
            }
        }

        @media (max-width: 380px) {
            .photo {
                height: 155px;
                border-width: 3px;
            }

            .guest-box img {
                height: 240px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="container-main">

        <!-- Small Heading -->
        <div class="heading">

            <h1>Inauguration</h1>

            <div class="line"></div>
        </div>


        <!-- 2 Guest Photos -->
        <div class="row g-4 align-items-center">

            <!-- Guest 1 -->
            <div class="col-lg-4 col-md-5">
                <div class="guest-box">

                    <!-- PHOTO 1 -->
                    <img src="assets/guest-1.jpg" alt="Guest 1">

                    <div class="guest-name">
                            KUVAR MANVENDRA SINGH
                     </div>


                     
                    <div class="guest-name">
                        VIDHAN PARISHAD SABHAPATI
                      </div>
                </div>
            </div>


            <!-- Center Text -->
            <div class="col-lg-4 col-md-2">
                <div class="center-text">

                    <h2>Grand<br>Inauguration</h2>

                    <p>
                        A New Beginning
                    </p>

                </div>
            </div>


            <!-- Guest 2 -->
            <div class="col-lg-4 col-md-5">
                <div class="guest-box">

                    <!-- PHOTO 2 -->
                    <img src="assets/guest-2.jpg" alt="Guest 2">

                    <div class="guest-name">
                        Upendra Nath Pasvan
                    </div>

                    
                    <div class="guest-name">
                        BJP GRAMIN JILA ADHYAKSH
                    </div>

                </div>
            </div>

        </div>


        <!-- 6 Program Photos -->
        <div class="gallery">

            <div class="row g-3">

                <div class="col-6 col-lg-4">
                    <div class="photo">
                        <img src="assets/program-1.jpg" alt="Program Photo 1">
                    </div>
                </div>

                <div class="col-6 col-lg-4">
                    <div class="photo">
                        <img src="assets/program-2.jpg" alt="Program Photo 2">
                    </div>
                </div>

                <div class="col-6 col-lg-4">
                    <div class="photo">
                        <img src="assets/program-3.jpg" alt="Program Photo 3">
                    </div>
                </div>

                <div class="col-6 col-lg-4">
                    <div class="photo">
                        <img src="assets/program-4.jpg" alt="Program Photo 4">
                    </div>
                </div>

                <div class="col-6 col-lg-4">
                    <div class="photo">
                        <img src="assets/program-5.jpg" alt="Program Photo 5">
                    </div>
                </div>

                <div class="col-6 col-lg-4">
                    <div class="photo">
                        <img src="assets/program-6.jpg" alt="Program Photo 6">
                    </div>
                </div>

                 <div class="col-6 col-lg-4">
                    <div class="photo">
                        <img src="assets/program-7.jpg" alt="Program Photo 6">
                    </div>
                </div>

                 <div class="col-6 col-lg-4">
                    <div class="photo">
                        <img src="assets/program-8.jpg" alt="Program Photo 6">
                    </div>
                </div>

                 <div class="col-6 col-lg-4">
                    <div class="photo">
                        <img src="assets/program-9.jpg" alt="Program Photo 6">
                    </div>
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
