<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annual Function 2026</title>

    <style>
        :root {
            --green: #486b43;
            --accent: #6ead65;
            --gold: #f2c14e;
            --cream: #fff8e8;
            --mint: #e8f7e8;
            --text: #55564f;
            --shadow: 0 16px 38px rgba(64, 82, 52, .12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            color: var(--text);
            background:
                radial-gradient(circle at 8% 3%, #fff0c8 0, transparent 30rem),
                linear-gradient(180deg, var(--cream), #fff 45%, var(--mint));
            font-family: "DM Sans", Arial, sans-serif;
        }

        header {
            padding: clamp(38px, 7vw, 76px) 20px;
            border-bottom: 1px solid rgba(72, 107, 67, .12);
            background:
                radial-gradient(circle at 82% 4%, rgba(242, 193, 78, .4), transparent 20rem),
                linear-gradient(120deg, var(--mint), var(--cream) 55%, #f2eafe);
            text-align: center;
        }

        header h1 {
            margin-bottom: 9px;
            color: var(--green);
            font-family: "Playfair Display", Georgia, serif;
            font-size: clamp(34px, 6vw, 60px);
            line-height: 1.12;
            text-wrap: balance;
        }

        header p {
            color: var(--text);
            font-size: clamp(15px, 2.2vw, 18px);
        }

        .container {
            width: min(1200px, calc(100% - 40px));
            margin: clamp(32px, 5vw, 52px) auto;
        }

        .intro {
            margin-bottom: clamp(22px, 4vw, 38px);
            text-align: center;
        }

        .intro h2 {
            margin-bottom: 6px;
            color: var(--green);
            font-family: "Playfair Display", Georgia, serif;
            font-size: clamp(27px, 4vw, 38px);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: clamp(12px, 2vw, 20px);
        }

        .photo {
            min-width: 0;
            padding: 7px;
            border: 1px solid rgba(72, 107, 67, .12);
            border-radius: 17px;
            background: #fff;
            box-shadow: var(--shadow);
            transition: transform .25s ease, box-shadow .25s ease;
        }

        .photo:hover {
            transform: translateY(-4px);
            box-shadow: 0 22px 42px rgba(64, 82, 52, .18);
        }

        .photo img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            border-radius: 10px;
            object-fit: cover;
            object-position: center;
        }

        .caption {
            padding: 10px 5px 4px;
            color: var(--green);
            font-weight: 700;
            text-align: center;
        }

        footer {
            margin-top: 50px;
            padding: 24px 18px;
            border-top: 1px solid rgba(72, 107, 67, .12);
            background: var(--mint);
            color: var(--green);
            text-align: center;
        }

        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 550px) {
            .container {
                width: calc(100% - 28px);
            }
        }

        @media (max-width: 360px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

    <header>

    </header>
